# Adaptive foreground: badge content centered in the ~66% safe zone so
# launchers can mask/parallax without clipping. Generated from the master
# icon (see README "App icon").
flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  android: "launcher_icon"
  min_sdk_android: 24
  adaptive_icon_background: "#0C1211"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
